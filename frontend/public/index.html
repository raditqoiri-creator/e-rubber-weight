<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Rubber Weight - Login</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background: linear-gradient(135deg,#1b4332,#2d6a4f); min-height:100vh; display:flex; align-items:center; }
  .login-card { max-width: 380px; margin: auto; border-radius: 16px; border:none; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
  .logo-img { width:80px; display:block; margin:0 auto 12px; }
</style>
</head>
<body>
<div class="container">
  <div class="card login-card p-4">
    <img src="logo-ptpn4.png" alt="Logo PTPN IV" class="logo-img">
    <h4 class="text-center mb-1">E-Rubber Weight</h4>
    <p class="text-center text-muted small mb-4">Pencatatan Hasil Sadap Lateks Harian<br>PTPN IV Regional I - Kebun Bandar Betsy</p>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" id="username" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required>
      </div>
      <div id="errorMsg" class="alert alert-danger py-2 d-none"></div>
      <button type="submit" class="btn w-100 text-white" style="background:#2d6a4f;">Masuk</button>
    </form>
  </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('errorMsg');
  const submitBtn = e.target.querySelector('button[type="submit"]');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Memproses...';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login gagal');
    localStorage.setItem('erw_user', JSON.stringify(data));
    window.location.href = 'dashboard.html';
  } catch (err) {
    errorMsg.textContent = err.message;
    errorMsg.classList.remove('d-none');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Masuk';
  }
});
</script>
</body>
</html>
